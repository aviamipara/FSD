<!--
                        NodeJS

    -- Callback

    -- setTimeout 
           
            syntax :
                     setTimeout(function,delay in ms)
                   
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function fun(){
            console.log("This message will be display after 5 seconds")
        }
        setTimeout(fun,5000)
    </script>
</head>
<body>
    
</body>
</html>
