<!-- Below JSON object a is given. Print below sentence in console from the 
given object.
Hi ! We are students of LJU . 
Exam - FSD2 
const a = { 
 "A" : "LJU",
 "B" : ["CSE", { 'M' : [ { "N" : "FSD2" } , "Exam" ]}],
 "C" : [ {
 "D" : "Hi",
 "E" : ['are', 4, {'F' : ['semester', 'We']} ]
 }],
 "G" : {"H" : "students", "I" : ["of","!"] },
 "J" : [{"K" :".", "L":"-"},"FSD-2"] 
 } -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const a = { 
        "A" : "LJU",
        "B" : ["CSE", { 'M' : [ { "N" : "FSD2" } , "Exam" ]}],
        "C" : [ {
        "D" : "Hi",
        "E" : ['are', 4, {'F' : ['semester', 'We']} ]
        }],
        "G" : {"H" : "students", "I" : ["of","!"] },
        "J" : [{"K" :".", "L":"-"},"FSD-2"] 
        };

        let sentence = 
            a.C[0].D + " " +                  // Hi
            a.G.I[1] + " " +                 // !
            a.C[0].E[2].F[1] + " " +         // We
            a.C[0].E[0] + " " +              // are
            a.G.H + " " +                    // students
            a.G.I[0] + " " +                 // of
            a.A + " " +                      // LJU
            a.J[0].K + "\n" +                // .
            a.B[1].M[1] + " - " +            // Exam -
            a.B[1].M[0].N;                   // FSD2

        console.log(sentence);

    </script>
</head>
