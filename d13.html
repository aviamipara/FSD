   write a script to store an array of three obj having name and age display name and age of persion with the highest age

    <meta charset="UTF-8">

    <title>Document</title>
    <script>
        let obj=[{name:"abc",age:19},{name:"pqr",age:50},{name:"xyz",age:22}]
        let oldperson=obj[0]
        for(i=1;i<obj.length;i++){
            if(obj[i].age>oldperson.age){
                 oldperson=obj[i]
            }
        }
        console.log(oldperson)
    </script>
