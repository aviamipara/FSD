<!-- 
    -- setInterval
           
              syntax :
                       setInterval(function,interval in ms)

    - it is call infinit time function

    
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function fun(){
            console.log(new Date().toLocaleTimeString())  // toLocaleTimeString() for current time
        }
        setInterval(fun,1000)
    </script>
</head>
<body>
    
</body>
</html>
