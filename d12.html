<!-- 
    Write a function first and last that takes in an array and returns an object with the first element of array
    as objs key and last element of array as that keys value  
-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function firstAndLast(array){
            let obj={}
            obj[array[0]]=array[array.length-1] // System to create object   obj[key]=value
            return obj
        }
        arr1=["abc","pqr","xyz","def"]
        console.log(firstAndLast(arr1))
    </script>
 </head>
