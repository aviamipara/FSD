<!-- To fech value from object

    Syntext :
             1.Dot notation
             
                 objectname.key

             2.bracket notation
              
                 objectname["key"]

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let obj={name:"abc",div:"D4"}
        console.log(obj.name)
        console.log(obj.div)
        
        console.log(obj["name"])
        console.log(obj["div"])
    </script>
</head>
<body>
    
</body>
</html>
