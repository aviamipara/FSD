<!-- 
  write a script that displays hello with incresing font size in interval of 50ms in bule color 
  and each should stop when font size reaches to 50px
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        size=15
        function add(){
            obj=document.getElementById("demo")
            obj.innerHTML="Hello"
            obj.style.color="blue"
            obj.style.fontSize=size+"px"
            if(size<=50){
                size++
            }
        }
        setInterval(add,50)
    </script>
</head>
<body>
    <p id="demo"></p>

</body>
</html>
