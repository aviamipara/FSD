<!-- 
  innitalise 2 veriables and increment both the veriables each time and display the addition of both the variables an interval of 1 second 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function add(a,b){
            document.getElementById("demo").innerHTML=(a+b)
        }
        a=5
        b=2

        setInterval(function(){add(++a,++b)},1000)
    </script>
</head>
<body>
    <p id="demo"></p>
</body>
</html>
